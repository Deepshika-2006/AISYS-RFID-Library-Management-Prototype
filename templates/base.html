
<!doctype html>
<html lang="en">

<head>

    <!-- =====================================================
         BASIC HTML SETTINGS
         ===================================================== -->

    <!-- Supports characters like ₹ and other Unicode text -->
    <meta charset="utf-8">

    <!-- Makes the application responsive on mobile/tablet -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <!-- Browser tab title -->
    <title>AISYS RFID Library</title>


    <!-- =====================================================
         APPLICATION CSS
         
         This file contains the common styling used by
         all pages in the application.
         ===================================================== -->
    <link
        rel="stylesheet"
        href="/static/app.css"
    >

</head>


<body>


    <!-- =====================================================
         AUTHENTICATED USER HEADER
         
         The header and navigation are displayed only when
         the user is logged in.
         
         user.is_authenticated is provided by Django.
         ===================================================== -->

    {% if user.is_authenticated %}

    <header class="topbar">


        <!-- =================================================
             BRAND / APPLICATION NAME
             ================================================= -->

        <div class="brand">

            <div class="brand-icon">
                A
            </div>

            <div>
                <strong>AISYS RFID Library</strong>

                <small>
                    Library Management System
                </small>
            </div>

        </div>


        <!-- =================================================
             MAIN NAVIGATION
             
             Provides access to all major modules.
             ================================================= -->

        <nav class="main-nav">

            <!-- Dashboard -->
            <a href="/">
                Dashboard
            </a>

            <!-- Books / OPAC -->
            <a href="/books/">
                Books
            </a>

            <!-- Members -->
            <a href="/members/">
                Members
            </a>

            <!-- Circulation -->
            <a href="/circulation/">
                Circulation
            </a>

            <!-- RFID Middleware -->
            <a href="/rfid/">
                RFID
            </a>

            <!-- Data Migration -->
            <a href="/migration/">
                Migration
            </a>

            <!-- Reports and Audit -->
            <a href="/reports/">
                Reports
            </a>

            <!-- Django Admin -->
            <a href="/admin/">
                Admin
            </a>

            <!-- Logout -->
            <a
                href="/logout/"
                class="logout-link"
            >
                Logout
            </a>

        </nav>


    </header>

    {% endif %}


    <!-- =====================================================
         MAIN APPLICATION CONTENT
         
         Every individual Django template inserts its
         content inside this area using:
         
         {% block content %}
         
         Examples:
         - Dashboard
         - Books
         - Members
         - Circulation
         - RFID
         - Migration
         - Reports
         ===================================================== -->

    <main class="main-content">


        <!-- =================================================
             DJANGO MESSAGE SYSTEM
             
             Displays messages such as:
             - Success
             - Error
             - Warning
             - Information
             
             These messages are generated by Django views.
             ================================================= -->

        {% for message in messages %}

        <div class="msg">

            {{message}}

        </div>

        {% endfor %}


        <!-- =================================================
             PAGE-SPECIFIC CONTENT
             
             Child templates insert their content here.
             ================================================= -->

        {% block content %}

        {% endblock %}


    </main>


</body>

</html>
